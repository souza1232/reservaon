services:
  db:
    image: postgres:16-alpine
    container_name: agendapro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendapro
      POSTGRES_PASSWORD: agendapro
      POSTGRES_DB: agendapro
    ports:
      - "5432:5432"
    volumes:
      - agendapro_pgdata:/var/lib/postgresql/data

volumes:
  agendapro_pgdata:
